[package]
name = "palette"
version = "0.3.1"
edition = "2024"
license = "MIT"

[lib]
name = "palette_server"
path = "src/lib.rs"

[[bin]]
name = "palette"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
similar = "2"

[dev-dependencies]
tempfile = "3"
