name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test (Rust workspace)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --workspace

      - name: cargo test
        run: cargo test --release --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Formatting is OS-agnostic, so this only needs to run once.
      - name: cargo fmt (check)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

  validate:
    name: validate.sh (rendered kits, inserts, IDs, leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # validate.sh runs `palette check` on this repository when the binary exists.
      - name: Build palette
        run: cargo build --release -p palette

      - name: Run validate.sh
        run: sh tooling/validate.sh

  shellcheck:
    name: shellcheck (tooling scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check install-mcp.sh
        run: shellcheck -s sh tooling/install-mcp.sh || true
      - name: Check render-kit.sh
        run: shellcheck -s sh tooling/render-kit.sh || true
      - name: Check validate.sh
        run: shellcheck -s sh tooling/validate.sh || true
      - name: Check entry point template
        run: shellcheck -s sh tooling/kit-scripts/entry/install.sh.tmpl || true
